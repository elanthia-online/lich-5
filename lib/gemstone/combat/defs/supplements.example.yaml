# Combat definition supplements - example file.
#
# Copy this to  <Lich data directory>/combat/defs.yaml  and edit. Lich reads
# it at login and again on  ;hmr combat/defs/  so a new pattern is live
# without a relog or a Lich release.
#
# Every entry is validated on its own. A bad entry is skipped with a message
# that names the kind, index and reason; the rest of the file still loads.
#
# Pattern rules
#   - Write patterns as SINGLE-QUOTED strings so backslashes survive YAML.
#   - Named captures are the contract with the parser:
#       (?<target>...)   the creature or player hit
#       (?<attacker>...) who swung, for third-person lines
#       (?<weapon>...)   the weapon, when the line names it
#   - Live game text arrives with XML links around names. Put {{MK_PRE}}
#     before a bare pronoun and {{MK_POST}} after a pronoun or possessive 's
#     and the pattern will match with or without the markup.
#   - Reusing a shipped name ADDS patterns to it. Everything the tracker
#     already knows about that name (damage attribution, flare flags,
#     manoeuvre handling) applies to your lines too. That is the common
#     case: a weapon with custom flare text, or a CMAN with unusual verbiage.
#   - Only patterns that contain a guaranteed literal run are cheap. A
#     pattern made only of wildcards is scanned on every line.
#
# Once a pattern proves out in play, please open a pull request so everyone
# gets it.

attacks:
  # A shipped manoeuvre with custom verbiage: same name, one more pattern.
  - name: tackle
    slot: priority                # priority | generic | third_person
    patterns:
      - 'You launch yourself bodily at (?<target>.+?) and connect!'

  # A genuinely new attack. Lands in the generic slot when slot: is omitted.
  - name: ice_lance
    patterns:
      - 'You hurl a lance of ice at (?<target>[^!]+)!'

flares:
  # A flare is a proc that rides on an attack: weapon scripts, enchants,
  # gloves, flourishes. Besides its patterns a flare carries three flags
  # that tell the tracker how to read the lines that follow it:
  #
  #   damaging: true when a damage line follows the flare line, so the
  #             tracker attributes that damage to the flare instead of the
  #             swing. Buff and utility flares (acuity, tailwind) are false.
  #   aoe:      false when the flare is strictly single-target even if its
  #             parent attack hits several creatures. true lets it own hits
  #             on every target in the attack.
  #   spawns:   true when the flare casts an imbedded spell as a SEPARATE
  #             attack (Blink is the shipped example), so the attack lines
  #             that follow in the same chunk are its children rather than
  #             independent casts.
  #
  # Timing is not a flag. Whether a flare lands before or after its swing
  # is read from where the line sits in the log.

  # A shipped flare with bespoke text. damaging/aoe/spawns are inherited
  # from the shipped acid flare; setting one to a different value is an
  # error, because one name must never carry two behaviours.
  - name: acid
    patterns:
      - '\*\* Your .+? spits a gob of acid at (?<target>.+?)! \*\*'
      - '\*\* (?<attacker>.+?)''s{{MK_POST}} .+? spits a gob of acid! \*\*'

  # A new flare. Omitted flags default to false, so a flare whose damage
  # you want tracked must say damaging: true.
  - name: frost_flare
    damaging: true
    aoe: false
    spawns: false
    patterns:
      - '\*\* Your .+? flares with frost, striking (?<target>.+?)! \*\*'

statuses:
  - name: chilled
    add:
      - '(?<target>.+?) shivers uncontrollably\.'
    remove:
      - '(?<target>.+?) stops shivering\.'

outcomes:
  # type must be one of the shipped outcome types, e.g. miss, hit, parry,
  # block, evade, fumble, resisted, warded, unaffected.
  - type: miss
    patterns:
      - 'The ice lance shatters harmlessly near (?<target>[^.]+)\.'

messages:
  # Messages are the non-combat lines a script subscribes to as events
  # (Combat::Tracker.on(:event_name) { |type, payload| ... }): a charge
  # counter, an item operation succeeding, an effect switching on or off.
  # Each def names its family and event, one or more patterns, and how to
  # build the payload from the match:
  #
  #   captures:  payload key -> named capture, with a type:
  #                string (default), integer, or symbol
  #   values:    payload key -> a literal (string, number, true/false/null)
  #
  # There is no boolean capture type, because game text never carries a
  # literal true/false: it has one line for the on state and another for
  # the off state. A boolean fact is two entries for the same event, each
  # with the literal under values: -- see the haze_703 pair below.
  #
  # If a capture did not participate in the match or an integer does not
  # parse, NOTHING is emitted (reported once), never a zero or empty fact.
  # The key  raw  is always added by Lich and cannot be set here.
  #
  # Reusing a shipped event adds patterns to it. The payload must satisfy
  # that event's contract (the keys and types its consumers rely on), and
  # the event stays in its shipped family.
  #
  # A new event must be named user_... and so must a new family, so a
  # future Lich release can never collide with your file.

  # Shipped event, shipped family: one more Swift Justice line. The
  # contract wants charges as an integer.
  - family: marks
    event: swift_justice
    patterns:
      - 'Your Swift Justice charges are restored to (?<n>\d+)\.'
    captures:
      charges: { from: n, type: integer }

  # Shipped event whose contract wants a BOOLEAN (haze_703: id as string,
  # on as boolean). A boolean cannot be captured, so the on and off lines
  # are two entries and each supplies  on:  as a literal. The id comes
  # from the creature link, which is how the shipped patterns capture it.
  - family: marks
    event: haze_703
    patterns:
      - '<a exist="(?<id>[^"]+)" noun="[^"]+">[^<]+</a>.*? is wreathed in a blood red haze\.'
    captures:
      id: id
    values:
      'on': true               # quoted: on/off/yes/no are YAML booleans, so a bare  on:  is the key true, not the word

  - family: marks
    event: haze_703
    patterns:
      - 'The blood red haze around <a exist="(?<id>[^"]+)" noun="[^"]+">[^<]+</a> fades\.'
    captures:
      id: id
    values:
      'on': false

  # A new family with a new event. Two defs, same event, different
  # literal facts.
  - family: user_item_prep
    event: user_feed_result
    patterns:
      - 'You feed the (?<what>.+?) and it hums softly\.'
    captures:
      what: what                 # shorthand for { from: what, type: string }
    values:
      ok: true

  - family: user_item_prep
    event: user_feed_result
    patterns:
      - 'You feed the (?<what>.+?) and it does nothing\.'
    captures:
      what: what
    values:
      ok: false
