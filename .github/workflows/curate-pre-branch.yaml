name: Curate Pre Branch
# =============================================================================
# Orchestrates PR cherry-picking to prerelease branches with conflict resolution
#
# Features:
#   - Multiple conflict strategies (abort, ours, theirs, union)
#   - Squash or preserve commit history
#   - Dry-run mode for safe testing
#   - Syntax validation after auto-resolution
#   - Pluggable and testable architecture
#
# See: .github/scripts/curate-pre-branch.sh for implementation
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Destination branch (auto-prefixed with pre/beta/)"
        required: true
        default: "pre/beta"
      base:
        description: "Base branch (must be main)"
        required: true
        default: "main"
      prs:
        description: "Comma-separated PR numbers (e.g., 12,27,43)"
        required: true
      mode:
        description: "auto | merged | head"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - merged
          - head
      squash:
        description: "Squash PRs into single commits?"
        required: true
        default: true
        type: boolean
      conflict_strategy:
        description: "Conflict resolution strategy"
        required: true
        default: "abort"
        type: choice
        options:
          - abort
          - ours
          - theirs
          - union
      reset_destination:
        description: "Force-recreate branch? (destroys history)"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Preview without pushing?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: curate-${{ github.ref }}-${{ inputs.destination }}
  cancel-in-progress: true

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      # Curated PRs can change workflow files, and the built-in token is never
      # allowed to push those. Mint a token from the org GitHub App that is. The
      # run stops here when the token cannot be minted; there is no fallback.
      - name: Mint a curate token from the org GitHub App
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      # Checkout keeps this token for the rest of the job, so every later git
      # fetch and push authenticates with it, including the destination branch
      # push and the anchor tag force-push.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Ruby only for the parse-only syntax checks. No bundler: this job must
      # not load a curated PR's Gemfile or rubocop configuration while the App
      # token is in reach.
      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler: none

      - name: Install dependencies with pkg cache
        run: sudo apt-get update -y

      - name: Install jq
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: jq
          version: 1.0

      - name: Curate pre-branch
        env:
          # Used only to read PR metadata from the API. Git fetches and pushes
          # use the App token that checkout kept.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DESTINATION: ${{ inputs.destination }}
          BASE: ${{ inputs.base }}
          PRS: ${{ inputs.prs }}
          MODE: ${{ inputs.mode }}
          SQUASH: ${{ inputs.squash }}
          CONFLICT_STRATEGY: ${{ inputs.conflict_strategy }}
          RESET_DESTINATION: ${{ inputs.reset_destination }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          chmod +x .github/scripts/curate-pre-branch.sh
          .github/scripts/curate-pre-branch.sh

      - name: Upload union merge audit artifacts
        if: ${{ always() && (env.HAD_CONFLICTS == 'true' || failure()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: union-merge-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/*.union-merge*
            ${{ env.CONFLICT_LOG_FILE }}
            conflict-log*.md
            conflict-log*.txt
            .github/scripts/conflict-log*.md
            .github/scripts/conflict-log*.txt
