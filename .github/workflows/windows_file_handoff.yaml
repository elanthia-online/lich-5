name: Windows File Handoff

on:
  push:
    branches:
      - main
    paths:
      - "lib/dependency_recovery.rb"
      - "spec/lib/dependency_recovery_spec.rb"
      - "lib/internal_api/active_sessions.rb"
      - "lib/internal_api/active_sessions/**"
      - "spec/lib/internal_api/active_sessions*_spec.rb"
      - "spec/lib/internal_api/active_sessions/**"
      - "spec/support/coordination_handoff_child.rb"
      - "lib/common/frontend_settings.rb"
      - "lib/common/sharing_violation_retry.rb"
      - "spec/lib/common/frontend_settings_spec.rb"
      - "spec/lib/common/sharing_violation_retry_spec.rb"
      - ".github/workflows/windows_file_handoff.yaml"
  pull_request:
    paths:
      - "lib/dependency_recovery.rb"
      - "spec/lib/dependency_recovery_spec.rb"
      - "lib/internal_api/active_sessions.rb"
      - "lib/internal_api/active_sessions/**"
      - "spec/lib/internal_api/active_sessions*_spec.rb"
      - "spec/lib/internal_api/active_sessions/**"
      - "spec/support/coordination_handoff_child.rb"
      - "lib/common/frontend_settings.rb"
      - "lib/common/sharing_violation_retry.rb"
      - "spec/lib/common/frontend_settings_spec.rb"
      - "spec/lib/common/sharing_violation_retry_spec.rb"
      - ".github/workflows/windows_file_handoff.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize administrator-initiated Windows checks
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Verify event and administrator identities before checkout
        id: permission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            core.setOutput('allowed', 'false');
            if (!['push', 'pull_request', 'workflow_dispatch'].includes(context.eventName)) {
              return core.setFailed('Unsupported Windows validation event.');
            }
            if (context.eventName !== 'pull_request' && context.ref !== 'refs/heads/main') {
              return core.setFailed('Push and dispatch checks must run from main.');
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const source = context.payload.repository;
            if (!Number.isSafeInteger(source?.id) || source.id <= 0 ||
                source.full_name?.toLowerCase() !== repository) {
              return core.setFailed('Repository identity is invalid.');
            }
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              if (pr?.head?.repo?.id !== source.id || pr?.base?.repo?.id !== source.id ||
                  pr.head.repo.full_name?.toLowerCase() !== repository ||
                  pr.base.repo.full_name?.toLowerCase() !== repository) {
                return core.setFailed('Only same-repository pull requests may run Windows checks.');
              }
            }
            const actors = [context.actor, process.env.TRIGGERING_ACTOR];
            if (actors.some(actor => typeof actor !== 'string' || !actor)) {
              return core.setFailed('Original and triggering actors are required.');
            }
            for (const actor of new Set(actors.map(actor => actor.toLowerCase()))) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: actor
              });
              if (data.permission !== 'admin') {
                return core.setFailed('Both original and triggering actors must be repository administrators.');
              }
            }
            core.setOutput('allowed', 'true');

  active_sessions_handoff:
    name: Exercise native Windows file handoff
    needs: authorize
    if: ${{ needs.authorize.outputs.allowed == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      BUNDLE_WITHOUT: 'gtk:vscode:profanity'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
      - name: Run ActiveSessions ownership and handoff specs
        run: bundle exec rspec spec/lib/internal_api/active_sessions_spec.rb spec/lib/internal_api/active_sessions_handoff_spec.rb spec/lib/internal_api/active_sessions/server_client_spec.rb
      - name: Run frontend settings specs
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/common/frontend_settings_spec.rb spec/lib/common/sharing_violation_retry_spec.rb
      - name: Run isolated native dependency recovery rollback specs
        run: bundle exec rspec spec/lib/dependency_recovery_spec.rb -e 'native replacement rollback'
