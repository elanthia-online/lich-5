name: Windows WebUI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An ineligible dispatch/re-run must not cancel an eligible owner's run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor_id }}-${{ github.triggering_actor }}
  cancel-in-progress: true

jobs:
  windows_webui:
    # Both the original actor and a re-run actor must be the authorized owner.
    # This guard runs before checkout; no PR code or external signal starts this job.
    if: >-
      github.repository == 'elanthia-online/lich-5' &&
      github.actor == 'OSXLich-Doug' && github.actor_id == '17682675' &&
      github.triggering_actor == 'OSXLich-Doug' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch')
    name: Native Windows WebUI coverage
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Retire gtk exclusion at P22 when Gemfile removes the native GTK group.
      BUNDLE_WITHOUT: 'gtk:vscode:profanity'
      LICH_CI_DEFAULT_WEBUI_ARTIFACT: tmp/windows-webui/default-entrypoint.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: spec/webui/package-lock.json
      - run: npm ci --prefix spec/webui
      - name: Install renderer engines
        working-directory: spec/webui
        shell: pwsh
        run: |
          npx --no-install playwright install webkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          if (-not ($chrome | Where-Object { Test-Path $_ })) {
            npx --no-install playwright install chrome
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Record runner and candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tmp/windows-webui | Out-Null
          [ordered]@{
            sha = $env:GITHUB_SHA
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            attempt = $env:GITHUB_RUN_ATTEMPT
            os = $env:RUNNER_OS
            image = $env:ImageVersion
            ruby = (& ruby --version)
            node = (& node --version)
          } | ConvertTo-Json | Set-Content tmp/windows-webui/runner.json
      - name: Run native Windows Ruby coverage
        shell: pwsh
        run: |
          $groups = [ordered]@{
            webui = @('spec/lib/webui')
            authentication = @('spec/lib/real_keychain_fence_spec.rb', 'spec/lib/common/authentication/entry_store_spec.rb', 'spec/lib/common/authentication/cli_password_spec.rb', 'spec/lib/common/cli/cli_encryption_mode_change_spec.rb', 'spec/lib/common/gui/account_manager_spec.rb', 'spec/lib/common/gui/master_password_manager_spec.rb')
            launcher = @('spec/lib/common/webui_launcher/controller_regressions_spec.rb', 'spec/lib/common/webui_launcher/catalog_browser_path_spec.rb', 'spec/lib/common/webui_launcher/catalog_password_changes_spec.rb', 'spec/lib/common/webui_launcher/window_geometry_store_spec.rb', 'spec/lib/common/webui_launcher_workflows_spec.rb', 'spec/lib/common/frontend_choices_spec.rb', 'spec/lib/util/memoryreleaser_spec.rb')
            builder = @('spec/lib/common/script_scope_builder_spec.rb', 'spec/lib/common/script_scope_builder_remaining_spec.rb', 'spec/lib/common/script_scope_destroy_sibling_reads_spec.rb', 'spec/lib/common/script_scope_model_coalescing_spec.rb', 'spec/lib/common/script_scope_css_corpus_spec.rb')
            # P22 owns these real-entrypoint specs and removal of the Windows skip.
            entrypoint = @('spec/lib/main/webui_startup_spec.rb', 'spec/lib/main/default_webui_acceptance_spec.rb', 'spec/lib/main/default_webui_acceptance_report_spec.rb')
          }
          # The testbed's informational gemcheck group is unrelated and omitted;
          # every selected group below is blocking, including entrypoint acceptance.
          $failed = $false
          foreach ($group in $groups.GetEnumerator()) {
            $name = $group.Key
            $specFiles = $group.Value
            $clock = [Diagnostics.Stopwatch]::StartNew()
            & bundle exec rspec @specFiles --format progress --format json --out "tmp/windows-webui/$name.json" 2>&1 | Tee-Object "tmp/windows-webui/$name.log"
            $code = $LASTEXITCODE
            $clock.Stop()
            if ($code -ne 0) { $failed = $true }
            [ordered]@{ group = $name; exit = $code; seconds = $clock.Elapsed.TotalSeconds } | ConvertTo-Json | Set-Content "tmp/windows-webui/$name-runtime.json"
            if (Test-Path "tmp/windows-webui/$name.json") {
              $result = Get-Content "tmp/windows-webui/$name.json" -Raw | ConvertFrom-Json
              "${name}: $($result.summary.example_count) examples, $($result.summary.failure_count) failures, $($result.summary.pending_count) pending; $($clock.Elapsed.TotalSeconds)s" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
          }
          # A green file-level run with a skipped/pending principal example is insufficient.
          $acceptance = Get-Content tmp/windows-webui/entrypoint.json -Raw | ConvertFrom-Json
          $principal = @($acceptance.examples | Where-Object { $_.full_description -eq 'default WebUI entrypoint acceptance authenticates the real page, exercises it, and shuts down without GTK' })
          if ($principal.Count -ne 1 -or $principal[0].status -ne 'passed') {
            Write-Output '::error::The principal default-WebUI entrypoint example must execute and pass on Windows (P22 dependency).'
            $failed = $true
          }
          if ($failed) { exit 1 }
      - name: Run logic and native renderer engines
        if: ${{ !cancelled() }}
        run: npm test --prefix spec/webui
      - name: Upload Windows coverage and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-webui-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tmp/windows-webui/
            spec/webui/test-results/
          if-no-files-found: warn
          retention-days: 14
