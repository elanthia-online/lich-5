# ------------------------------------------------------------------------------
# RSpec CI: required-check-safe preflight
#
# Purpose
# - Keep the RSpec check present and green for branch protection on every push/PR,
#   while skipping the heavy Ruby setup and test run when a change only touches
#   docs/meta files that cannot affect tests.
#
# What changed
# - Added a cheap "preflight" step that inspects changed files and sets
#   steps.preflight.outputs.should_test to 'true' or 'false'.
# - The expensive steps (checkout, setup-ruby, rspec) now run only when
#   should_test == 'true'. Otherwise, a short noop step runs so the workflow
#   still completes successfully and satisfies required checks.
#
# How preflight decides
# - For pull_request: lists changed files via pulls.listFiles.
# - For push: compares commits between before and the new SHA.
# - It classifies paths against a small ignore set:
#     .github/workflows/**
#     .github/actions/**
#     .github/tests/test-guard-pre-branch-pr.sh (covered by workflow_guard)
#     .gitattributes
#     .gitignore
#     .rubocop.yml
#     .ruby-version
#     netlify.toml
#     README.adoc
#     release-please-config.json
#     release-please-config.prerelease.json
#     **/*.md        (Markdown anywhere. Other docs/ files are not ignored:
#                     some specs read data files kept under docs/)
# - If ANY non-ignored file changed, should_test = true.
# - If it cannot determine the file list (API edge cases), it defaults to
#   should_test = true for safety.
#
# Intentional non-ignores (always trigger tests when changed)
# - spec/**            (test edits must be validated by CI)
# - Gemfile, Gemfile.lock (dependency changes can affect runtime behavior)
#
# Operational effects
# - Docs/meta-only PRs finish fast with a clear "skipped" message.
# - Test-only or dependency-only PRs still run the full RSpec job.
# - No trigger conditions were changed; the workflow still starts on the same
#   push/PR events so required checks remain intact.
#
# Parallel run
# - The suite runs with parallel_tests on four workers (-n 4). Workers are
#   balanced from tmp/parallel_runtime_rspec.log, which each run writes and
#   actions/cache carries forward (falls back to file size when absent).
# - One seed is picked per run and passed to every worker, so on failure
#   --verbose-rerun-command prints a complete local repro: files and --seed.
# - A separate job ("Changed spec files on their own") runs each changed
#   *_spec.rb file alone, in parallel with the suite, so a spec that only passes
#   because another file loaded first fails in the PR that added it.
#
# Maintenance
# - To adjust what is considered "meta-only", edit the IGNORES array in the
#   preflight script. Be conservative: do not add app code paths here.
# ------------------------------------------------------------------------------
#
# The RSpec jobs below moved here unchanged from rspec_tests.yaml so ci-gate can
# require them. Lint (RuboCop + ruby -c) comes from the shared Elanthia Online
# workflow; the PR title check stays in lint_pr.yaml because it must also run
# when a PR's title is edited.
# ------------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A newer push to a pull request cancels that pull request's older run. Each push
# to main has its own group, so its run is neither cancelled nor made to wait
# behind another, and every merge finishes the suites its own changes selected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows_contract:
    name: Windows recovery and installer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-r4l5-contract

  # Shared lint from elanthia-online/.github, pinned by full SHA. Tests run in
  # the repo-specific jobs below.
  ruby:
    uses: elanthia-online/.github/.github/workflows/ruby-ci.yml@e3a2bc90e9f0dc97a6f881282e27e94883cd5b41 # v1.1.0
    with:
      lint-scope: repo
      run-tests: false

  workflow_guard:
    # Independent of Ruby preflight so workflow-only changes exercise the guard.
    name: Test pre-beta PR guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run inert workflow guard tests
        run: bash .github/tests/test-guard-pre-branch-pr.sh

  test:
    runs-on: ubuntu-latest
    # The suite normally finishes in under a minute; cap the job so a hung
    # example (see the DRRoom cross-process state leak fixed in spec_helper) fails
    # fast instead of occupying a runner up to GitHub's 6h default.
    timeout-minutes: 15
    env:
      BUNDLE_WITHOUT: 'vscode:profanity'
    name: Run tests on Ruby
    steps:
      - name: Classify changed files (preflight)
        id: preflight
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const ev    = context.eventName;
            // Tier-1 ignores for tests (no spec/**, no Gemfiles)
            const IGNORES = [
              '.github/workflows/**',
              '.github/actions/**',
              '.github/tests/test-guard-pre-branch-pr.sh',
              '.gitattributes',
              '.gitignore',
              '.rubocop.yml',
              '.ruby-version',
              'netlify.toml',
              'README.adoc',
              'release-please-config.json',
              'release-please-config.prerelease.json',
              '**/*.md',
            ];
            function isIgnored(path) {
              // basic /** suffix, **/*.ext anywhere, and exact matches
              return IGNORES.some(p => {
                if (p.startsWith('**/*.')) {
                  return path.endsWith(p.slice(4)); // '**/*.md' -> '.md'
                }
                if (p.endsWith('/**')) {
                  const base = p.slice(0, -3); // remove /**
                  return path.startsWith(base);
                }
                return path === p;
              });
            }
            async function changedFilesForPR(number) {
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: number, per_page: 100 }
              );
              return files.map(f => ({ name: f.filename, status: f.status }));
            }
            async function changedFilesForPush() {
              const before = (context.payload.before || '').trim();
              const head   = context.sha;
              if (!before) return null;
              const cmp = await github.rest.repos.compareCommits({ owner, repo, base: before, head });
              return (cmp.data.files || []).map(f => ({ name: f.filename, status: f.status }));
            }
            let files = null;
            if (ev === 'pull_request') {
              const num = context.payload.pull_request && context.payload.pull_request.number;
              files = num ? await changedFilesForPR(num) : null;
            } else if (ev === 'push') {
              files = await changedFilesForPush();
            }
            if (!files || files.length === 0) {
              core.notice('Preflight: could not determine changed files; defaulting to run tests.');
              core.setOutput('should_test', 'true');
            } else {
              const nonIgnored = files.filter(f => !isIgnored(f.name));
              const should = nonIgnored.length > 0;
              core.notice(`Preflight: changed files = ${files.length}, non-ignored = ${nonIgnored.length}; should_test=${should}`);
              core.setOutput('should_test', should ? 'true' : 'false');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.preflight.outputs.should_test == 'true'
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: steps.preflight.outputs.should_test == 'true'
        with:
          bundler-cache: true
      - name: Restore spec runtime log
        if: steps.preflight.outputs.should_test == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}
          restore-keys: rspec-runtime-
      - name: Run RSpec tests
        if: steps.preflight.outputs.should_test == 'true'
        env:
          # Four workers share four vCPUs, which inflates example times 2-3x, so
          # the 2s slow-example warning is noise here. The "Changed spec files on
          # their own" job runs unloaded at the default 2s and covers the files a
          # PR changes; 60s here only flags pathological examples.
          RSPEC_SLOW_EXAMPLE_SECONDS: '60'
        run: |
          seed=$RANDOM
          echo "RSpec seed: $seed"
          bundle exec parallel_rspec -n 4 --serialize-stdout --verbose-rerun-command -o "--seed $seed" spec
      - name: RSpec skipped (docs/meta-only change)
        if: steps.preflight.outputs.should_test != 'true'
        run: echo "Preflight determined only ignored paths changed; skipping RSpec."

  changed_specs:
    # Runs beside the suite rather than after it, so a PR that touches slow spec
    # files does not add their solo runtime to the "Run tests on Ruby" job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_WITHOUT: 'vscode:profanity'
    name: Changed spec files on their own
    steps:
      - name: List changed spec files
        id: list
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            let files = [];
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles,
                { owner, repo, pull_number: context.payload.pull_request.number, per_page: 100 });
            } else if (context.eventName === 'push' && (context.payload.before || '').trim()) {
              const cmp = await github.rest.repos.compareCommits({ owner, repo, base: context.payload.before, head: context.sha });
              files = cmp.data.files || [];
            }
            const specs = files
              .filter(f => f.status !== 'removed' && /^spec\/.+_spec\.rb$/.test(f.filename))
              .map(f => f.filename);
            core.info(`Changed spec files: ${specs.length}`);
            core.setOutput('specs', specs.join('\n'));
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.list.outputs.specs != ''
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: steps.list.outputs.specs != ''
        with:
          bundler-cache: true
      - name: Run each changed spec file alone
        if: steps.list.outputs.specs != ''
        env:
          CHANGED_SPECS: ${{ steps.list.outputs.specs }}
        run: |
          failed=()
          while IFS= read -r spec; do
            [ -f "$spec" ] || continue
            echo "::group::$spec"
            bundle exec rspec "$spec" || failed+=("$spec")
            echo "::endgroup::"
          done <<< "$CHANGED_SPECS"
          if [ ${#failed[@]} -gt 0 ]; then
            for spec in "${failed[@]}"; do
              echo "::error file=$spec::Passes in the full suite but fails when run alone. It depends on another spec file loading first; require what it uses directly."
            done
            exit 1
          fi
      - name: No changed spec files
        if: steps.list.outputs.specs == ''
        run: echo "No *_spec.rb files changed; nothing to run alone."

  # ----------------------------------------------------------------------------
  # WebUI suites
  #
  # One job decides, from the changed files, which WebUI suites this change can
  # affect: the JavaScript renderer, the Chrome browser specs, native Windows
  # and native macOS. Each suite is a called workflow that runs only when
  # selected, and ci-gate requires every selected suite to pass. Pull requests
  # and pushes to main are classified the same way. If the changed files or the
  # Windows selection table cannot be read, every suite runs.
  # ----------------------------------------------------------------------------
  classify:
    name: Classify WebUI suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      renderer: ${{ steps.classify.outputs.renderer }}
      browser: ${{ steps.classify.outputs.browser }}
      windows: ${{ steps.classify.outputs.windows }}
      macos: ${{ steps.classify.outputs.macos }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Shared with the Windows selection guard through its source helper.
            // Parse data only; never execute code from the pull request.
            function windowsSpecPaths(workflow) {
              const groups = workflow.replace(/\r\n/g, '\n').match(/^          \$groups = \[ordered\]@\{\n([\s\S]*?)^          \}/m)?.[1];
              if (!groups) throw new Error('expected the Windows RSpec selection table');
              const selected = [...groups.matchAll(/'(spec\/[^']+)'/g)].map(match => match[1]);
              if (!selected.length) throw new Error('expected selected Windows specs');
              return selected;
            }
            // In every list below an entry ending in '/' or '_' is a prefix;
            // any other entry is an exact path.
            //
            // Paths the renderer, browser and Windows jobs depend on.
            const WEBUI_PATHS = [
              'lib/webui/', 'lib/webui.rb',
              'lib/common/script_scope/', 'lib/common/script_scope.rb', 'lib/common/script_death.rb',
              'lib/common/webui_launcher.rb', 'lib/common/webui_launcher/',
              'spec/webui/', 'spec/fixtures/webui/', 'spec/lib/webui/', 'spec/lib/common/script_scope_',
              'spec/support/webui_', 'spec/spec_helper.rb', 'spec/login_spec_helper.rb', 'spec/support/frontend_mock.rb',
              'spec/support/data_dir.rb', 'spec/support/real_keychain_fence.rb',
              'spec/lib/common/webui_launcher_presentation_browser_spec.rb',
              '.rspec', '.rspec_parallel',
              // Providers the launcher and login helpers load (authentication, GUI, frontend, sessions).
              'lib/common/authentication/', 'lib/common/gui/', 'lib/common/gui_login.rb',
              'lib/common/front-end.rb', 'lib/common/frontend.rb', 'lib/common/frontend_',
              'lib/common/session_launcher.rb', 'lib/common/saga_launch_policy.rb', 'lib/common/saga_managed_launcher.rb',
              'lib/common/process_launcher.rb', 'lib/common/ruby_executable.rb', 'lib/common/sharing_violation_retry.rb',
              'lib/common/windows_command_line.rb', 'lib/util/deep_freeze.rb',
              'Gemfile', 'Gemfile.lock',
              // setup-ruby in the browser job passes no ruby-version, so it reads this file.
              '.ruby-version',
            ];
            // Startup and gem recovery, which only the Windows job runs end to
            // end. lib/version.rb is left out: every release rewrites it.
            const WINDOWS_STARTUP_PATHS = [
              'lich.rbw', 'lib/main/early_exit.rb', 'lib/gemcheck.rb', 'lib/bundler_recovery.rb',
              'lib/dependency_recovery.rb', 'lib/accepted_gem_policy.rb', 'lib/runtime_gem_contract.rb',
              'lib/recovery_unit_policy.rb',
            ];
            // Helpers that carry the default-startup acceptance result between
            // processes; the Windows job is where that file handling is proven.
            const WINDOWS_ACCEPTANCE_PATHS = [
              'spec/support/default_webui_acceptance_',
            ];
            // What the macOS job compiles and runs: the native host, its
            // presentation spec, and the helpers every rspec process loads.
            const MACOS_PATHS = [
              'lib/webui/native/',
              'spec/lib/webui/native_host_presentation_spec.rb', 'spec/webui/native_presentation.swift',
              'spec/spec_helper.rb', 'spec/support/data_dir.rb', 'spec/support/frontend_mock.rb',
              'spec/support/real_keychain_fence.rb', '.rspec',
            ];
            // A change to how the suites are selected or run selects all of them.
            const ALL_SUITE_PATHS = [
              '.github/workflows/ci.yml', '.github/workflows/webui_tests.yaml',
              '.github/workflows/windows_webui.yaml', '.github/workflows/macos_webui.yaml',
              '.github/scripts/windows_runtime_', '.github/scripts/macos_webui_smoke.py',
            ];
            const SUITES = ['renderer', 'browser', 'windows', 'macos'];
            const runEverySuite = reason => {
              core.notice(`${reason}; running every WebUI suite.`);
              for (const suite of SUITES) core.setOutput(suite, 'true');
            };
            const within = paths => path => paths.some(p => p.endsWith('/') || p.endsWith('_') ? path.startsWith(p) : path === p);
            try {
              const { owner, repo } = context.repo;
              let files, source;
              if (context.eventName === 'pull_request') {
                files = await github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: context.payload.pull_request.number, per_page: 100,
                });
                // The API returns at most 3,000 files; a capped list may hide a path.
                if (files.length >= 3000) return runEverySuite('Changed-file list reached the API limit');
                const head = context.payload.pull_request.head;
                source = { owner: head.repo.owner.login, repo: head.repo.name, ref: head.sha };
              } else if (context.eventName === 'push') {
                const before = (context.payload.before || '').trim();
                if (!before || /^0+$/.test(before)) return runEverySuite('No previous commit to compare with');
                const { data } = await github.rest.repos.compareCommits({ owner, repo, base: before, head: context.sha });
                // The comparison lists at most 300 files, and may omit the list.
                if (!Array.isArray(data.files) || data.files.length >= 300) return runEverySuite('Changed-file list is missing or reached the API limit');
                files = data.files;
                source = { owner, repo, ref: context.sha };
              } else {
                return runEverySuite(`Event ${context.eventName} has no changed-file list`);
              }
              const { data } = await github.rest.repos.getContent({ ...source, path: '.github/workflows/windows_webui.yaml' });
              if (data.encoding !== 'base64' || typeof data.content !== 'string') {
                throw new Error('expected the Windows workflow file content');
              }
              const selected = windowsSpecPaths(Buffer.from(data.content, 'base64').toString('utf8'));
              const windowsSpec = path => selected.some(p => path === p || (!p.endsWith('.rb') && path.startsWith(`${p}/`)));
              const webui = within(WEBUI_PATHS), startup = within(WINDOWS_STARTUP_PATHS), acceptance = within(WINDOWS_ACCEPTANCE_PATHS);
              const everySuite = within(ALL_SUITE_PATHS), macos = within(MACOS_PATHS);
              const shared = path => everySuite(path) || webui(path) || windowsSpec(path);
              const reaches = {
                renderer: shared,
                browser: shared,
                windows: path => shared(path) || startup(path) || acceptance(path),
                macos: path => everySuite(path) || macos(path),
              };
              // A rename or deletion out of a suite's paths still counts: check the old name too.
              const paths = [...new Set(files.flatMap(file => file.previous_filename ? [file.filename, file.previous_filename] : [file.filename]))];
              core.info(`Changed files = ${files.length}`);
              for (const suite of SUITES) {
                const hits = paths.filter(reaches[suite]);
                core.info(hits.length ? `${suite}: selected by ${hits.slice(0, 20).join(', ')}${hits.length > 20 ? `, and ${hits.length - 20} more` : ''}` : `${suite}: not needed`);
                core.setOutput(suite, hits.length > 0 ? 'true' : 'false');
              }
            } catch (error) {
              runEverySuite(`Could not classify changed files (${error.message})`);
            }

  # The Node tests for the classifier, the gate rule and the called workflows.
  # They use no packages, so they run on every change without an install.
  webui_policy:
    name: WebUI workflow policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.5.0'
      - name: Run the workflow policy tests
        run: >-
          node --test
          spec/webui/webui_workflow_classification_test.cjs
          spec/webui/webui_windows_workflow_test.cjs
          spec/webui/webui_macos_workflow_test.cjs
          spec/webui/webui_ci_gate_test.cjs

  webui_renderer:
    needs: classify
    if: needs.classify.outputs.renderer == 'true'
    uses: ./.github/workflows/webui_tests.yaml
    with:
      suite: renderer

  webui_browser:
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    uses: ./.github/workflows/webui_tests.yaml
    with:
      suite: browser

  windows_webui:
    needs: classify
    if: needs.classify.outputs.windows == 'true'
    uses: ./.github/workflows/windows_webui.yaml

  macos_webui:
    needs: classify
    if: needs.classify.outputs.macos == 'true'
    uses: ./.github/workflows/macos_webui.yaml

  ci-gate:
    name: ci-gate
    if: always()
    needs: [ruby, workflow_guard, test, changed_specs, windows_contract, classify, webui_policy, webui_renderer, webui_browser, windows_webui, macos_webui]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable job to pass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            // A WebUI suite the classifier selected must succeed. One it did
            // not select must be skipped. Every other job must succeed.
            // Anything else fails, including a missing or malformed decision.
            const needs = JSON.parse(process.env.NEEDS);
            const SUITE_JOBS = { renderer: 'webui_renderer', browser: 'webui_browser', windows: 'windows_webui', macos: 'macos_webui' };
            const decisions = needs.classify?.outputs || {};
            const failures = [];
            for (const job of ['classify', ...Object.values(SUITE_JOBS)]) {
              if (!(job in needs)) failures.push(`${job}: missing from the gate`);
            }
            for (const [job, need] of Object.entries(needs)) {
              const suite = Object.keys(SUITE_JOBS).find(name => SUITE_JOBS[name] === job);
              let expected = 'success';
              if (suite) {
                const decision = decisions[suite];
                if (decision !== 'true' && decision !== 'false') {
                  core.info(`${job}: ${need.result} (no ${suite} decision)`);
                  failures.push(`${job}: classify gave no ${suite} decision`);
                  continue;
                }
                expected = decision === 'true' ? 'success' : 'skipped';
              }
              core.info(`${job}: ${need.result} (expected ${expected})`);
              if (need.result !== expected) failures.push(`${job}: ${need.result}, expected ${expected}`);
            }
            if (failures.length) core.setFailed(`ci-gate failed: ${failures.join('; ')}`);
