# Automatically close pre/beta-to-main PRs; fixes belong in the source PRs.
# Only comment on and close the triggering PR. Never execute PR code or cancel other workflows.
name: guard pre/beta PRs to main

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

concurrency:
  group: guard-prepr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  pull-requests: write

jobs:
  block:
    if: ${{ github.event.pull_request.state == 'open' && startsWith(github.event.pull_request.head.ref, 'pre/beta') && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Close with policy comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: "Direct merges from `pre/beta` to `main` are disallowed by policy. Make changes in the originating open PRs and prepare another beta if needed. This PR will be closed unmerged."
            });
            await github.rest.pulls.update({ owner, repo, pull_number: number, state: "closed" });
